# Build the Astro site and publish it to GitHub Pages.
# Requires Settings > Pages > Source: GitHub Actions.
# Author: Sean Bowman, 10/05/2026

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so the build-time GitHub repository data on Home and Projects stays current
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer run cancels a queued older one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Authenticated GitHub API requests during the build (src/lib/github.js)
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
